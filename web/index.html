<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrialRevive</title>
<meta name="description" content="Une question scientifique entre, un dossier de faisabilité sort : quels essais cliniques peuvent répondre, avec quelle preuve.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B7F58'/%3E%3Crect x='6' y='12' width='20' height='8' rx='4' transform='rotate(-45 16 16)' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-state="landing">
<a class="skip" href="#main">Aller au contenu</a>

<div class="app">
  <nav class="rail" aria-label="Navigation principale">
    <a class="brand" href="#/" aria-label="TrialRevive, accueil">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1B7F58"/><g transform="rotate(-45 16 16)"><rect x="5.5" y="11.5" width="21" height="9" rx="4.5" fill="#fff"/><path d="M16 11.5h6.5a4.5 4.5 0 0 1 0 9H16z" fill="#B8ECD2"/></g></svg>
      <span>TrialRevive</span>
    </a>
    <ul class="nav" id="nav"></ul>
    <div class="rail-foot">
      <p><span class="dot dot-amber" aria-hidden="true"></span>Patients de l'essai interne : fictifs</p>
      <p>Essais publics : ClinicalTrials.gov</p>
    </div>
  </nav>

  <div class="stage">
    <header class="askbar" id="askbar">
      <form class="ask ask-compact" id="askFormCompact" autocomplete="off">
        <label class="sr" for="qCompact">Votre question scientifique</label>
        <input id="qCompact" name="q" type="text" maxlength="600" placeholder="Posez une question scientifique" spellcheck="true">
        <button class="btn btn-primary" type="submit">Analyser</button>
        <button class="btn btn-ghost" type="button" data-demo>Cas de démo</button>
      </form>
      <p class="badge badge-amber" title="Aucune donnée de santé réelle n'est utilisée"><span class="dot dot-amber" aria-hidden="true"></span>Patients fictifs</p>
    </header>
    <p class="alert" id="alert" role="alert" hidden></p>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="scrim" data-close></div>
  <div class="panel">
    <button class="close" type="button" data-close aria-label="Fermer le détail">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div id="drawerBody"></div>
  </div>
</aside>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="/assets/vendor/three.min.js"></script>
<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
